# Local stack: MySQL + rfid-poker server.
#
#   docker compose up -d --build
#
# The server listens on :8080 (WebSocket at ws://localhost:8080/ws); override the host port with RFID_POKER_PORT.
# Card UIDs come from CARD_CONFIG (default: config.dev.yaml, synthetic UIDs for the simulator).
# Point it at your scanned deck with: CARD_CONFIG=./config.yaml docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rfid-poker
      MYSQL_DATABASE: rfid_poker
      MYSQL_USER: rfid_poker
      MYSQL_PASSWORD: rfid-poker
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urfid_poker", "-prfid-poker"]
      interval: 3s
      timeout: 3s
      retries: 30

  server:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RFID_POKER_MYSQL_USER: rfid_poker
      RFID_POKER_MYSQL_PASS: rfid-poker
      RFID_POKER_MYSQL_HOST: mysql
      RFID_POKER_MYSQL_PORT: "3306"
      RFID_POKER_MYSQL_DATABASE: rfid_poker
      RFID_POKER_CONFIG_PATH: /config.yaml
      RFID_POKER_CLIENT_TIMEOUT_SECONDS: ${RFID_POKER_CLIENT_TIMEOUT_SECONDS:-10}
    volumes:
      - ${CARD_CONFIG:-./config.dev.yaml}:/config.yaml:ro
    ports:
      - "${RFID_POKER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  mysql-data:
